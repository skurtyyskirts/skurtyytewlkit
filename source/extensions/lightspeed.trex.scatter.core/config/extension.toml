[package]
kit_sdk_version = "110.*"
authors = ["skurtyyskirts <148610406+skurtyyskirts@users.noreply.github.com>"]
title = "NVIDIA RTX Remix Scatter Brush Core"
description = "Core logic for the RTX Remix asset scatter brush: settings, sampling, surface geometry, placement commands and presets"
version = "1.0.0"
readme = "docs/README.md"
repository = "https://gitlab-master.nvidia.com/lightspeedrtx/lightspeed-kit/-/tree/main/source/extensions/lightspeed.trex.scatter.core"
category = "internal"
keywords = ["remix", "scatter", "brush"]
changelog = "docs/CHANGELOG.md"
preview_image = "data/preview.png"
icon = "data/icon.png"

[dependencies]
"lightspeed.common" = {}
"lightspeed.hydra.remix.core" = {}
"lightspeed.trex.asset_replacements.core.shared" = {}
"omni.client" = {}
"omni.flux.pip_archive" = {}
"omni.flux.utils.common" = {}
"omni.kit.commands" = {}
"omni.usd" = {}

[settings]
exts."lightspeed.trex.scatter.core".forceCpuPicker = false
exts."lightspeed.trex.scatter.core".presetsDirectory = ""

[[python.module]]
name = "lightspeed.trex.scatter.core"

[[test]]
dependencies = [
    "lightspeed.trex.tests.dependencies",
]

args = [
    "--/exts/omni.flux.utils.widget/default_resources_ext='lightspeed.trex.app.resources'",
    "--/exts/lightspeed.trex.scatter.core/forceCpuPicker=true",
]

stdoutFailPatterns.exclude = [
    "*[omni.kit.registry.nucleus.utils.common] Skipping deletion of:*",
]

[[test]]
name = "startup"
dependencies = [
    "lightspeed.trex.tests.dependencies",
]
