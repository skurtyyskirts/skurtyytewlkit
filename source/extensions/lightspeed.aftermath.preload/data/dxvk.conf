# RTX Remix Toolkit fallback DXVK config.
# Keep this minimal; game and mod dxvk.conf files own visual/runtime tuning.

dxvk.enableAftermath = True

# Guard Blackwell (RTX 50-series) and unstable runtime configurations:
# 1. Opacity Micromaps (OMM) exceed memory budgets on complex foliage/alpha geometry leading to GPU page faults.
rtx.opacityMicromap.enable = False

# 2. Integrate Indirect Mode: ReSTIR GI (1) is stable; NRC (2) causes GPU device lost on Blackwell/driver 621.
rtx.integrateIndirectMode = 1

# 3. Volumetric atmosphere ReSTIR initial light sampling can page fault into unmapped BLAS/OMM structures.
rtx.volumetrics.enableAtmosphere = False
