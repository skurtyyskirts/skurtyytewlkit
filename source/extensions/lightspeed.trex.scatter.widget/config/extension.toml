[package]
kit_sdk_version = "110.*"
authors = ["skurtyyskirts <148610406+skurtyyskirts@users.noreply.github.com>"]
title = "NVIDIA RTX Remix Scatter Brush Window"
description = "Scatter window for the RTX Remix asset scatter brush: brush settings, asset list, flood and presets"
version = "1.0.0"
readme = "docs/README.md"
repository = "https://gitlab-master.nvidia.com/lightspeedrtx/lightspeed-kit/-/tree/main/source/extensions/lightspeed.trex.scatter.widget"
category = "internal"
keywords = ["remix", "scatter", "brush"]
changelog = "docs/CHANGELOG.md"
preview_image = "data/preview.png"
icon = "data/icon.png"

[dependencies]
"lightspeed.common" = {}
"lightspeed.trex.asset_replacements.core.shared" = {}
"lightspeed.trex.contexts" = {}
"lightspeed.trex.scatter.core" = {}
"lightspeed.trex.utils.widget" = {}
"omni.flux.utils.widget" = {}
"omni.ui" = {}
"omni.usd" = {}

[[python.module]]
name = "lightspeed.trex.scatter.widget"

[[test]]
dependencies = [
    "lightspeed.trex.tests.dependencies",
]

args = [
    "--/exts/omni.flux.utils.widget/default_resources_ext='lightspeed.trex.app.resources'",
    "--/exts/lightspeed.trex.scatter.core/forceCpuPicker=true",
]

stdoutFailPatterns.exclude = [
    "*[omni.kit.registry.nucleus.utils.common] Skipping deletion of:*",
]

[[test]]
name = "startup"
dependencies = [
    "lightspeed.trex.tests.dependencies",
]
